<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuiz | 註冊學生帳號</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #F8FAFC;
            /* 背景科技感網格 */
            background-image: 
                linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .login-glass {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus {
            outline: none;
            border-color: #A855F7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .btn-neon {
            background: linear-gradient(135deg, #A855F7 0%, #6366F1 100%);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }

        /* 裝飾用的動態光圈 */
        .blob {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.2);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 overflow-hidden relative">

    <div class="blob -top-10 -left-10"></div>
    <div class="blob -bottom-10 -right-10" style="background: rgba(99, 102, 241, 0.2);"></div>

    <div class="w-full max-w-md mt-12">
        <div class="text-center mb-6">
            <h1 class="text-4xl font-bold tracking-tighter text-white">
                CYBER<span class="text-purple-500">PQ</span>
            </h1>
        </div>

        <div class="login-glass rounded-3xl p-10">
            <div class="mb-8">
                <h2 class="text-2xl font-bold">建立新帳號</h2>
            </div>

            {% if messages %}
                <div class="mb-5 space-y-2">
                    {% for message in messages %}
                        <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-[0_0_15px_rgba(239,68,68,0.15)]">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="" method="POST" class="space-y-5">
                {% csrf_token %} <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Username / 學號或帳號</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" name="username" required placeholder="請輸入您想設定的帳號" 
                            class="w-full bg-slate-900/50 border border-gray-700 rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 input-glow transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Password / 設定密碼</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" required placeholder="請輸入密碼" 
                            class="w-full bg-slate-900/50 border border-gray-700 rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 input-glow transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Confirm Password / 確認密碼</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-shield-alt text-sm"></i>
                        </span>
                        <input type="password" name="password2" required placeholder="請再次輸入密碼" 
                            class="w-full bg-slate-900/50 border border-gray-700 rounded-xl py-3 pl-11 pr-4 text-white placeholder-gray-600 input-glow transition-all">
                    </div>
                </div>

                <button type="submit" class="w-full btn-neon py-4 rounded-xl font-bold text-white shadow-lg mt-2">
                    註冊帳號
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-800 text-center text-sm">
                <span class="text-gray-500">已有帳號？</span>
                <a href="{% url 'login' %}" class="text-purple-400 font-semibold hover:underline ml-1">點此登入</a>
            </div>
        </div>

    </div>

</body>
</html>
