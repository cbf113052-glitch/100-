<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberQuiz | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #F8FAFC;
            background-image: 
                linear-gradient(rgba(168, 85, 247, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(168, 85, 247, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .login-glass {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.6);
        }

        .input-glow:focus {
            outline: none;
            border-color: #A855F7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        .btn-neon {
            background: linear-gradient(135deg, #A855F7 0%, #6366F1 100%);
            transition: all 0.3s ease;
        }

        .btn-neon:hover {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5);
            transform: translateY(-2px);
        }

        .blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(168, 85, 247, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 overflow-hidden relative">

    <div class="blob -top-20 -left-20"></div>
    <div class="blob -bottom-20 -right-20" style="background: rgba(99, 102, 241, 0.15);"></div>

    <div class="w-full max-w-2xl">
        <div class="text-center mb-10">
            <h1 class="text-5xl font-bold tracking-tighter text-white">
                CYBER<span class="text-purple-500">PQ</span>
            </h1>
        </div>

        <div class="login-glass rounded-[40px] p-12 md:p-16">
            <div class="mb-10 text-center"> 
                <h2 class="text-3xl font-bold">歡迎回來</h2>
                <p class="text-gray-400 text-base mt-3">請登入系統以開始資料結構線上測驗</p>
            </div>

            <div class="max-w-md mx-auto mb-6">
                {% if form.errors %}
                    <div class="bg-red-500/10 border border-red-500/50 text-red-400 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-[0_0_15px_rgba(239,68,68,0.2)]">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>❌ 帳號或密碼輸入錯誤，請重新確認！</span>
                    </div>
                {% endif %}

                {% if messages %}
                    {% for message in messages %}
                        <div class="bg-green-500/10 border border-green-500/50 text-green-400 px-4 py-3 rounded-xl text-sm font-semibold flex items-center gap-2 shadow-[0_0_15px_rgba(34,197,94,0.2)]">
                            <i class="fas fa-check-circle"></i>
                            <span>{{ message }}</span>
                        </div>
                    {% endfor %}
                {% endif %}
            </div>

            <form action="" method="POST" class="space-y-6 max-w-md mx-auto">
                {% csrf_token %} <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Username / 學號</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-user text-sm"></i>
                        </span>
                        <input type="text" name="username" placeholder="輸入您的帳號" required
                            class="w-full bg-slate-900/60 border border-gray-700 rounded-xl py-3 pl-11 pr-4 text-white text-base placeholder-gray-600 input-glow transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase tracking-widest mb-2">Password / 密碼</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-gray-500">
                            <i class="fas fa-lock text-sm"></i>
                        </span>
                        <input type="password" name="password" placeholder="••••••••" required
                            class="w-full bg-slate-900/60 border border-gray-700 rounded-xl py-3 pl-11 pr-4 text-white text-base placeholder-gray-600 input-glow transition-all">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full btn-neon py-3 rounded-xl font-bold text-base text-white shadow-lg">
                        登入系統
                    </button>
                </div>
            </form>

            <div class="mt-10 pt-10 border-t border-gray-800/50 text-center text-sm">
                <span class="text-gray-500">還沒有帳號嗎？</span>
                <a href="{% url 'register' %}" class="text-purple-400 font-semibold hover:underline ml-2">立即註冊</a>
            </div>
        </div>
    </div>

</body>
</html>
