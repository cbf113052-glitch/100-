<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>堆積與優先佇列 | 題庫清單</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <style>
        body {
            background-color: #0F172A;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #F8FAFC;
            background-image: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.05) 0%, transparent 80%);
            background-attachment: fixed;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(168, 85, 247, 0.2);
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="p-6 md:p-10">

    <div class="max-w-5xl mx-auto pt-6 px-4">
        <a href="dashboard.html" class="glass-panel inline-flex items-center gap-2 px-5 py-2.5 rounded-2xl text-sm font-bold text-gray-300 hover:text-white hover:border-purple-500/50 transition-all group">
            <i class="fas fa-home text-purple-500 group-hover:scale-110 transition-transform"></i>
            主畫面
        </a>
    </div>
    
    <div class="max-w-5xl mx-auto">
        <div class="mb-10 text-center">
            <h1 class="text-3xl font-bold tracking-tight text-white">題庫內容總覽</h1>
            <p class="text-gray-400 mt-2">目前系統內所有關於 Heap 與 Priority Queue 的題目與解答紀錄。</p>
        </div>

        <div class="glass-panel rounded-2xl p-6 mb-8 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="relative w-full md:w-96">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                <input type="text" placeholder="快速搜尋題目或關鍵字..." 
                    class="w-full bg-slate-900/50 border border-gray-700 rounded-xl py-2.5 pl-12 pr-4 focus:outline-none focus:border-purple-500 text-sm">
            </div>
            <div class="flex gap-6">
                <div class="text-center">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest">總題數</p>
                    <p class="text-xl font-bold text-purple-400 font-mono">45</p>
                </div>
                <div class="border-l border-gray-800 h-8"></div>
                <div class="text-center">
                    <p class="text-[10px] text-gray-500 uppercase tracking-widest">平均難度</p>
                    <p class="text-xl font-bold text-blue-400 font-mono">中等</p>
                </div>
            </div>
        </div>

        <div class="glass-panel rounded-[32px] overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-slate-800/80 border-b border-gray-700">
                        <th class="p-6 text-xs font-bold uppercase tracking-wider text-gray-400">編號</th>
                        <th class="p-6 text-xs font-bold uppercase tracking-wider text-gray-400">題目敘述</th>
                        <th class="p-6 text-xs font-bold uppercase tracking-wider text-gray-400">標準答案</th>
                        <th class="p-6 text-xs font-bold uppercase tracking-wider text-gray-400">難度分級</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-800">
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 mono text-purple-400 text-sm">#PQ-001</td>
                        <td class="p-6">
                            <p class="text-sm text-gray-200 leading-relaxed">在一個最大堆積 (Max-Heap) 中，刪除根節點後，應將哪個節點移至根部再進行調整？</p>
                        </td>
                        <td class="p-6">
                            <span class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-xs font-bold border border-green-500/20">
                                最後一個葉節點
                            </span>
                        </td>
                        <td class="p-6 text-xs font-bold text-green-400 uppercase tracking-widest">Easy</td>
                    </tr>

                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 mono text-purple-400 text-sm">#PQ-002</td>
                        <td class="p-6">
                            <p class="text-sm text-gray-200 leading-relaxed">Priority Queue 在作業系統排程中主要負責什麼工作？</p>
                        </td>
                        <td class="p-6">
                            <span class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-xs font-bold border border-green-500/20">
                                根據權重處理行程
                            </span>
                        </td>
                        <td class="p-6 text-xs font-bold text-purple-400 uppercase tracking-widest">Medium</td>
                    </tr>

                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="p-6 mono text-purple-400 text-sm">#PQ-003</td>
                        <td class="p-6">
                            <p class="text-sm text-gray-200 leading-relaxed">建立一個長度為 n 的 Heap，其總體時間複雜度為何？</p>
                        </td>
                        <td class="p-6">
                            <span class="bg-green-500/10 text-green-400 px-3 py-1 rounded-full text-xs font-bold border border-green-500/20">
                                O(n)
                            </span>
                        </td>
                        <td class="p-6 text-xs font-bold text-red-400 uppercase tracking-widest">Hard</td>
                    </tr>
                    
                    </tbody>
            </table>

            <div class="p-6 bg-slate-900/30 border-t border-gray-800 text-center">
                <button class="text-sm text-gray-500 hover:text-purple-400 transition-colors">
                    載入更多題目 <i class="fas fa-chevron-down ml-2"></i>
                </button>
            </div>
        </div>
    </div>

</body>
</html>
